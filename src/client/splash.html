<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Wuxia Spire — Ascend the Nine Heavens</title>
  </head>
  <body class="hd-splash">
    <canvas class="hd-splash__vista" id="splash-vista" aria-hidden="true"></canvas>

    <header class="hd-splash__topbar">
      <span class="hd-splash__user" id="greeting">Wanderer</span>
      <div class="hd-splash__stats">
        <span>Streak <b id="stat-streak">1d</b></span>
        <span>Runs <b id="stat-delves">0</b></span>
        <span class="hd-splash__date" id="date-pill">TODAY</span>
      </div>
    </header>

    <div class="hd-splash__center">
      <div class="hd-splash__lockup">
        <span class="wuxia-seal" aria-hidden="true">武</span>
        <h1 class="hd-splash__title">WUXIA SPIRE</h1>
      </div>
      <div class="hd-splash__subtitle">Nine Heavens · Daily Spire</div>
    </div>

    <nav class="hd-win hd-splash__menu" aria-label="Main commands">
      <button class="hd-splash__item is-primary" id="start-button" type="button">
        <span class="hd-splash__cursor" aria-hidden="true">▸</span>
        <span class="hd-splash__label">ASCEND THE SPIRE</span>
        <span class="hd-splash__hint" id="biome-name">Daily Sect</span>
      </button>
      <button class="hd-splash__item" id="how-to-btn" type="button">
        <span class="hd-splash__cursor" aria-hidden="true">▸</span>
        <span class="hd-splash__label">Martial Codex</span>
        <span class="hd-splash__hint" id="sub-status">Unarmed · 3 Arts + 3 Qi</span>
      </button>
      <button class="hd-splash__item" id="reddit-link" type="button">
        <span class="hd-splash__cursor" aria-hidden="true">▸</span>
        <span class="hd-splash__label">Sect Hall</span>
        <span class="hd-splash__hint">r/Devvit</span>
      </button>
    </nav>

    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
